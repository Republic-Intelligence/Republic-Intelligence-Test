<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Republic Intelligence Academy</title>
<style>
body{margin:0;font-family:Consolas,monospace;background:#07111c;color:#9ee7ff;display:flex;justify-content:center;align-items:center;height:100vh}
.panel{width:900px;background:#0b1725;border:2px solid #2ea8ff;padding:30px;box-shadow:0 0 25px #0af5}
h1{text-align:center;color:#fff}#phase{color:#6fd4ff}#cipher{font-size:30px;text-align:center;color:#fff;letter-spacing:4px;margin:20px}
input,button{width:100%;padding:14px;font:inherit}
input{background:#08111b;color:#fff;border:1px solid #2ea8ff}
button{margin-top:12px;background:#2288dd;color:#fff;border:none;cursor:pointer}
button:hover{background:#35a5ff}
#result{margin-top:20px;text-align:center;min-height:70px}
.code{font-size:28px;color:#fff}
.small{font-size:14px;color:#ffd66b}
</style>
</head>
<body>
<div class="panel">
<h1>REPUBLIC OFFICE OF INTELLIGENCE</h1>
<div id="phase">Phase I / II — Caesar Cipher</div>
<p>Attempts: <span id="attempts">0</span></p>
<div id="cipher">WKH VHQDWH LV LQ GDQJHU</div>
<p>Decrypt the intercepted transmission.</p>
<input id="answer" placeholder="Enter decrypted message">
<button id="submitBtn" onclick="check()">SUBMIT</button>
<div id="result"></div>
</div>
<script>
let attempts=0;
let phase=1;

const saved=localStorage.getItem("RI_FINAL_CODE");
if(saved){
 lockExam(saved);
}

function genCode(){
 const L="ABCDEFGHIJKLMNOPQRSTUVWXYZ",N="0123456789";
 let c="RI-";
 for(let i=0;i<4;i++)c+=L[Math.floor(Math.random()*26)];
 c+="-";
 for(let i=0;i<6;i++)c+=N[Math.floor(Math.random()*10)];
 return c;
}

function lockExam(code){
 document.getElementById("answer").disabled=true;
 document.getElementById("submitBtn").disabled=true;
 document.getElementById("result").innerHTML=
 `<span style="color:#5cff8d">EXAM ALREADY COMPLETED<br><br>
 Verification Code:<br><span class="code">${code}</span><br><br>
 DM <b>Deputy Director Asa S.</b> this code to continue your application.
 <div class="small">Do not share this code. Additional codes cannot be generated from this browser.</div></span>`;
}

function check(){
 attempts++;
 document.getElementById("attempts").textContent=attempts;
 const a=document.getElementById("answer").value.trim().toUpperCase();

 if(phase===1){
   if(a==="THE SENATE IS IN DANGER"){
      phase=2;
      document.getElementById("phase").textContent="Phase II / II — Atbash Cipher";
      document.getElementById("cipher").textContent="IVKFYORX RMGVOVRTVMXV RH HVXFIV";
      document.getElementById("answer").value="";
      document.getElementById("result").innerHTML="<span style='color:#5cff8d'>Phase I Passed. Proceed to Phase II.</span>";
   }else{
      document.getElementById("result").innerHTML="<span style='color:#ff6666'>Incorrect decryption.</span>";
   }
 }else{
   if(a==="REPUBLIC INTELLIGENCE IS SECURE"){
      const code=genCode();
      localStorage.setItem("RI_FINAL_CODE",code);
      lockExam(code);
   }else{
      document.getElementById("result").innerHTML="<span style='color:#ff6666'>Incorrect decryption.</span>";
   }
 }
}
</script>
</body>
</html>
