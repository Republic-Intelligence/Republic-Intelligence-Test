<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Republic Office of Naval Intelligence</title>

<style>
body{
    margin:0;
    background:#05080d;
    color:#7fd9ff;
    font-family:Consolas, monospace;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.panel{
    width:850px;
    border:2px solid #2ea8ff;
    box-shadow:0 0 20px rgba(0,170,255,.3);
    padding:30px;
    background:#08111d;
}

h1{
    margin-top:0;
    text-align:center;
    color:white;
}

.subtitle{
    text-align:center;
    color:#7fd9ff;
    margin-bottom:30px;
}

hr{
    border:1px solid #2ea8ff;
}

#cipher{
    font-size:28px;
    text-align:center;
    letter-spacing:4px;
    margin:30px;
    color:white;
}

input{
    width:100%;
    padding:15px;
    background:#0d1725;
    color:white;
    border:1px solid #2ea8ff;
    font-size:18px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:15px;
    margin-top:15px;
    background:#2ea8ff;
    color:white;
    border:none;
    cursor:pointer;
    font-size:18px;
}

button:hover{
    background:#56bbff;
}

#result{
    margin-top:20px;
    text-align:center;
    font-size:18px;
}
</style>

</head>
<body>

<div class="panel">

<h1>REPUBLIC OFFICE OF NAVAL INTELLIGENCE</h1>

<div class="subtitle">
CLEARANCE EXAMINATION TERMINAL
</div>

<hr>

<p><b>Incoming Transmission #001</b></p>

<div id="cipher">
WKH VHQDWH LV LQ GDQJHU
</div>

<p>Decrypt the intercepted transmission.</p>

<input id="answer" placeholder="Enter decrypted message">

<button onclick="checkAnswer()">
DECRYPT
</button>

<div id="result"></div>

</div>

<script>

function checkAnswer(){

let answer =
document.getElementById("answer")
.value
.trim()
.toUpperCase();

if(answer=="THE SENATE IS IN DANGER"){

document.getElementById("result").innerHTML=
"<span style='color:lime;'>ACCESS GRANTED<br><br>Clearance Level I Achieved.</span>";

}else{

document.getElementById("result").innerHTML=
"<span style='color:red;'>ACCESS DENIED</span>";

}

}

</script>

</body>
</html>
